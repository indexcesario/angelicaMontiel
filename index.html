<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angélica Montiel - Asesora Inmobiliaria</title>
  <style>
    :root {
      --primary: #1a365d;
      --accent: #2b6cb0;
      --bg: #f7fafc;
      --text: #2d3748;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.6; }
    
    header { background-color: var(--primary); color: white; text-align: center; padding: 3rem 1rem; }
    header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
    header p { font-size: 1.1rem; opacity: 0.9; }

    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    h2 { color: var(--primary); margin-bottom: 1.5rem; font-size: 1.6rem; border-bottom: 2px solid var(--accent); padding-bottom: 0.5rem; display: inline-block; }

    .properties-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .card-content { padding: 1.5rem; }
    .card-title { font-size: 1.2rem; color: var(--primary); margin-bottom: 0.5rem; }

    footer { text-align: center; padding: 2rem; margin-top: 3rem; background: #edf2f7; color: #718096; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1>Angélica Montiel</h1>
    <p>Asesora Inmobiliaria</p>
  </header>

  <div class="container">
    <h2>Propiedades Destacadas</h2>
    <div id="propiedades-container" class="properties-grid">
      <p>Cargando catálogo...</p>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Angélica Montiel - Todos los derechos reservados.</p>
  </footer>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('propiedades-container');
      setTimeout(() => {
        container.innerHTML = '<p>Visita el panel de administración para publicar tus inmuebles.</p>';
      }, 800);
    });
  </script>

</body>
</html>
